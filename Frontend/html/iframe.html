<!DOCTYPE html>
<html>
<head>
<title>iframe Target Example</title>
</head>
<body>
<h1>HTML iframe Target Example</h1>
<!-- Link with target set to iframe name -->
<iframe width="560" height="315" src="https://www.youtube.com/embed/aRGdDy18qfY?si=Igkh6ETbQKFBj81T" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
