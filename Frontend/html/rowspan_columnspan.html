<!DOCTYPE html>
<html>
<head>
 <title>Rowspan and Colspan Example</title>
</head>
<body>
 <h1>Rowspan and Colspan Example</h1>
 <table border="1">
 <tr>
 <th colspan="2">Employee Information</th>
 </tr>
 <tr>
 <th>Name</th>
 <th>Department</th>
 </tr>
 <tr>
 <td rowspan="2">Alice</td>
 <td>HR</td>
 </tr>
 <tr>
 <td>Finance</td>
 </tr>
 <tr>
 <td colspan="2">Bob (Manager)</td>
 </tr>
 </table>
</body>
</html>
