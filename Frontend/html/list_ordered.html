<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered List</title>
</head>
<body>
    <h2>Ordered List</h2>
    <ol>
        <li>Preheat the oven to 350°F</li>
        <li>Mix the ingredients</li>
        <li>Bake for 25 minutes</li>
    </ol>
    <h2>Unordered List</h2>
        <ul>
            <li>Apples</li>
            <li>bananas</li>
            <li>oranges</li>
        </ul>
</body>
