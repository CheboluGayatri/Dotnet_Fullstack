<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset ="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Div vs Span</title>
    </head>
    <body>
        <!-- using div to create sections -->
    <div style="border: 1px solid hwb(0 5% 94%); margin-bottom:10px;">
        <h2>Section 2</h2>
        <p>This is a second section.</p>
    </div>
    <!-- using span to style specific text-->
    <p>This is some text with <span style="color:green;">green word</span> and a <span style="color:blue;">blue word</span>.</p>
</html>
