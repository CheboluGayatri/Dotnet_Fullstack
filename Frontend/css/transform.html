<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Css</title>
    <style>
        .transform{
            transform: scaleY(0.4);
            background-color: aliceblue;
            padding: 20px;
            border: 2px solid red;
        }
    </style>
</head>

<body>
    <div class="transform">
        The specific CSS property whose value change needs to be transitioned (or) all, if
        all the transitionable properties need to be transitioned
    </div>

</body>

</html>
