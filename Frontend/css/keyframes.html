<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes</title>
    <style> 
         @keyframes rotateBtn {
            0% {
                margin-top: -100vh;
                transform: rotate(45deg);
            }

            30% {
                margin-top: -20vh;
                transform: rotate(180deg);
            }

            60% {
                margin-top: -10vh;
                transform: rotate(270deg);
            }

            100% {
                marin-top: 0;
                transform: rotatex(180deg);
            }

        }
        .login{
            border: 1px solid rgb(128, 128, 128);
            max-width: auto;
            max-height: auto;
            width: 300px;
            height: auto;
            /* position: absolute;
            transform: translate(40vw, 30vh); */
            padding: 20px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        button {
            animation: rotateBtn 1s normal 500ms;
            position: absolute;
            background: red;
            border: none;
            padding: 1px;
        }

        .btn-grad {
            background-image: linear-gradient(to right, #02AAB0 0%, #00CDAC 51%, #02AAB0 100%);
        }

        .btn-grad {
            margin: 10px;
            padding: 10px 20px;
            text-align: center;
            text-transform: uppercase;
            transition: 0.5s;
            background-size: 200% auto;
            color: white;
            box-shadow: 0 0 20px #1191c3;
            border-radius: 10px;
            display: block;
            outline: none;
            border: none;
            font-size: 10px;
        }

        .btn-grad:hover {
            background-position: right center;
            color: #fff;
            text-decoration: none;
        }

        * {
            margin: 10px;
        }
    </style>
</head>

<body>
    <div class="login">
        <form>
            <h1>Login Page</h1>
            <label>Email id</label>
            <input type="email" placeholder="Enter your Email" required /><br />
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required /></br>
            <button type="submit" class="btn-grad">Login</button>
            </fieldset>
        </form>
    </div>

</body>

</html>
